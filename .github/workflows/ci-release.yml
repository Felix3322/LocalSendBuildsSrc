name: Build and publish preview release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    name: Resolve build metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      title: ${{ steps.metadata.outputs.title }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v6

      - id: metadata
        name: Create a unique prerelease tag
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' app/pubspec.yaml)"
          short_sha="${GITHUB_SHA::7}"
          branch="$(printf '%s' "$GITHUB_REF_NAME" | tr '/[:space:]' '-' | tr -cd '[:alnum:]._-')"

          if [ -z "$version" ] || [ -z "$branch" ]; then
            echo "Unable to determine build metadata." >&2
            exit 1
          fi

          tag="preview-$branch-$short_sha-$GITHUB_RUN_ID"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=LocalSend $version preview ($short_sha)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

  android:
    name: Android APKs
    needs: metadata
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Create a temporary preview signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/localsend-preview.jks" \
            -storepass preview-build \
            -keypass preview-build \
            -alias localsend-preview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=LocalSend Preview, O=OB_BUFF"
          cat > app/android/key.properties <<EOF
          storePassword=preview-build
          keyPassword=preview-build
          keyAlias=localsend-preview
          storeFile=$RUNNER_TEMP/localsend-preview.jks
          EOF

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build split APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/LocalSend-$VERSION-android-arm32v7.apk"
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/LocalSend-$VERSION-android-arm64v8.apk"
          cp app/build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/LocalSend-$VERSION-android-x86_64.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: android-apks
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  linux-tar:
    name: Linux x86_64 tarball
    needs: metadata
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux app
        working-directory: app
        run: flutter build linux --release

      - name: Package tarball
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C app/build/linux/x64/release/bundle -czf "dist/LocalSend-$VERSION-linux-x86_64.tar.gz" .

      - uses: actions/upload-artifact@v6
        with:
          name: linux-tarball
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  linux-deb:
    name: Linux x86_64 DEB
    needs: metadata
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"

      - name: Package DEB
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart pub global activate flutter_distributor
          export PATH="$PATH:$HOME/.pub-cache/bin"
          flutter_distributor package --platform linux --targets deb

      - name: Collect DEB
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          deb="$(find app/dist -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          mkdir -p dist
          cp "$deb" "dist/LocalSend-$VERSION-linux-x86_64.deb"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  linux-appimage:
    name: Linux x86_64 AppImage
    needs: metadata
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libfuse2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Linux app
        working-directory: app
        run: flutter build linux --release

      - name: Prepare AppImage input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir
          cp -a app/build/linux/x64/release/bundle/. AppDir/
          mkdir -p AppDir/usr/share/icons/hicolor/32x32/apps
          mkdir -p AppDir/usr/share/icons/hicolor/128x128/apps
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp app/assets/img/logo-32.png AppDir/usr/share/icons/hicolor/32x32/apps/localsend.png
          cp app/assets/img/logo-128.png AppDir/usr/share/icons/hicolor/128x128/apps/localsend.png
          cp app/assets/img/logo-256.png AppDir/usr/share/icons/hicolor/256x256/apps/localsend.png
          cp support/build/appimage/AppImageBuilder_x86_64.yml AppImageBuilder.yml

      - name: Build AppImage
        uses: AppImageCrafters/build-appimage@57c3bc6963f870ce3be103117de5b5e33ffbaeb6
        with:
          recipe: ./AppImageBuilder.yml

      - name: Collect AppImage
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          mkdir -p dist
          cp "$appimage" "dist/LocalSend-$VERSION-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows:
    name: Windows x86_64 ZIP and MSIX
    needs: metadata
    runs-on: windows-2022

    steps:
      - name: Enable long file paths
        shell: pwsh
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - name: Copy source to a short build path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "C:/s" -Force | Out-Null
          robocopy "$env:GITHUB_WORKSPACE" "C:/s" /E /XD .git
          if ($LASTEXITCODE -ge 8) {
            exit $LASTEXITCODE
          }
          $global:LASTEXITCODE = 0

          $cmakeFile = "C:/s/packages/localsend_isolates/rust_builder/windows/CMakeLists.txt"
          $cmake = Get-Content -Path $cmakeFile -Raw
          $oldManifest = "../../../../../../rust"
          $newManifest = "../../../../../../../packages/localsend_isolates/rust"
          if (-not $cmake.Contains($oldManifest)) {
            throw "Expected Windows Rust manifest path was not found."
          }
          Set-Content -Path $cmakeFile -Value $cmake.Replace($oldManifest, $newManifest) -NoNewline

          $runnerCmakeFile = "C:/s/app/windows/runner/CMakeLists.txt"
          $runnerCmake = Get-Content -Path $runnerCmakeFile -Raw
          $dwmapiLink = 'target_link_libraries(${BINARY_NAME} PRIVATE "dwmapi.lib")'
          $runtimeObjectLink = 'target_link_libraries(${BINARY_NAME} PRIVATE "runtimeobject.lib")'
          if (-not $runnerCmake.Contains($dwmapiLink)) {
            throw "Expected Windows runner link target was not found."
          }
          Set-Content -Path $runnerCmakeFile -Value $runnerCmake.Replace($dwmapiLink, "$dwmapiLink`n$runtimeObjectLink") -NoNewline

          $appCmakeFile = "C:/s/app/windows/CMakeLists.txt"
          $appCmake = Get-Content -Path $appCmakeFile -Raw
          $missingHelperInstall = '(?m)^\s*"localsend_msix_helper\.msix"\r?\n\s*"install_msix_helper\.ps1"\r?\n'
          if (-not [regex]::IsMatch($appCmake, $missingHelperInstall)) {
            throw "Expected proprietary MSIX helper install entries were not found."
          }
          Set-Content -Path $appCmakeFile -Value ([regex]::Replace($appCmake, $missingHelperInstall, "")) -NoNewline

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable

      - name: Install dependencies
        working-directory: C:/s/app
        shell: pwsh
        run: flutter pub get

      - name: Build Windows app
        working-directory: C:/s/app
        shell: pwsh
        run: flutter build windows --release

      - name: Create portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          New-Item -ItemType File -Path "C:/s/app\\build\\windows\\x64\\runner\\Release\\settings.json" -Force | Out-Null
          Copy-Item "C:/s/support\\build\\windows\\x64\\msvcp140.dll" "C:/s/app\\build\\windows\\x64\\runner\\Release\\"
          Copy-Item "C:/s/support\\build\\windows\\x64\\vcruntime140.dll" "C:/s/app\\build\\windows\\x64\\runner\\Release\\"
          Copy-Item "C:/s/support\\build\\windows\\x64\\vcruntime140_1.dll" "C:/s/app\\build\\windows\\x64\\runner\\Release\\"
          New-Item -ItemType Directory -Path C:/s/dist -Force | Out-Null
          Compress-Archive -Path "C:/s/app\\build\\windows\\x64\\runner\\Release\\*" -DestinationPath "C:/s/dist\\LocalSend-$env:VERSION-windows-x86_64.zip" -Force

      - name: Create unsigned MSIX
        working-directory: C:/s/app
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          flutter pub add --dev "msix:3.18.0"
          dart run msix:create `
            --build-windows false `
            --output-path "C:/s/dist" `
            --output-name "LocalSend-${env:VERSION}-windows-x86_64-unsigned" `
            --display-name "LocalSend" `
            --publisher-display-name "OB_BUFF" `
            --identity-name "OBBUFF.LocalSendPreview" `
            --publisher "CN=OB_BUFF" `
            --version "${env:VERSION}.0" `
            --logo-path "assets\img\logo-256.png" `
            --architecture x64 `
            --capabilities "internetClient,internetClientServer,privateNetworkClientServer" `
            --sign-msix false `
            --install-certificate false

      - uses: actions/upload-artifact@v6
        with:
          name: windows-packages
          path: C:/s/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish prerelease and update website index
    needs:
      - metadata
      - android
      - linux-tar
      - linux-deb
      - linux-appimage
      - windows
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-localsend-builds
      cancel-in-progress: false

    steps:
      - name: Download all build assets
        uses: actions/download-artifact@v7
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )

      - name: Require a destination-repository token
        shell: bash
        env:
          DESTINATION_REPO_TOKEN: ${{ secrets.LOCALSEND_BUILDS_TOKEN }}
        run: |
          if [ -z "$DESTINATION_REPO_TOKEN" ]; then
            echo "::error::Set the LOCALSEND_BUILDS_TOKEN secret before updating the website index."
            exit 1
          fi

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.title }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out the distribution repository
        uses: actions/checkout@v6
        with:
          repository: Felix3322/LocalsendBuilds
          ref: main
          token: ${{ secrets.LOCALSEND_BUILDS_TOKEN }}
          path: distribution

      - name: Update the website index
        shell: bash
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          assets='[]'
          for file in release-assets/*; do
            filename="$(basename "$file")"
            if [ "$filename" = "SHA256SUMS.txt" ]; then
              continue
            fi
            size="$(stat -c '%s' "$file")"
            platform="Other"
            format="File"
            arch="Universal"
            signed='null'

            case "$filename" in
              *.msix)
                platform="Windows"; format="MSIX"; arch="x86_64"; signed='false' ;;
              *windows*.zip)
                platform="Windows"; format="Portable ZIP"; arch="x86_64" ;;
              *android-arm32v7.apk)
                platform="Android"; format="APK"; arch="armeabi-v7a" ;;
              *android-arm64v8.apk)
                platform="Android"; format="APK"; arch="arm64-v8a" ;;
              *android-x86_64.apk)
                platform="Android"; format="APK"; arch="x86_64" ;;
              *.AppImage)
                platform="Linux"; format="AppImage"; arch="x86_64" ;;
              *.deb)
                platform="Linux"; format="DEB"; arch="x86_64" ;;
              *.tar.gz)
                platform="Linux"; format="tar.gz"; arch="x86_64" ;;
            esac

            assets="$(jq -c \
              --arg platform "$platform" \
              --arg format "$format" \
              --arg arch "$arch" \
              --arg url "$RELEASE_BASE/$filename" \
              --argjson size "$size" \
              --argjson signed "$signed" \
              '. + [{platform: $platform, format: $format, arch: $arch, url: $url, size: $size, signed: $signed}]' \
              <<< "$assets")"
          done

          build="$(jq -cn \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg commit "$COMMIT" \
            --arg build_url "$RUN_URL" \
            --arg created_at "$(date --utc --iso-8601=seconds)" \
            --arg message "Automated preview build. Android APKs use a temporary CI signing key." \
            --argjson assets "$assets" \
            '{tag: $tag, version: $version, source_commit: $commit, created_at: $created_at, message: $message, build_url: $build_url, assets: $assets}')"

          if [ -f distribution/builds.json ]; then
            jq --argjson build "$build" \
              '[$build] + [.[] | select(.tag != $build.tag)] | .[:50]' \
              distribution/builds.json > distribution/builds.json.tmp
          else
            jq -n --argjson build "$build" '[$build]' > distribution/builds.json.tmp
          fi
          mv distribution/builds.json.tmp distribution/builds.json

          cd distribution
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds.json
          git diff --cached --quiet || git commit -m "build: publish $TAG"
          git pull --rebase origin main
          git push origin HEAD:main
