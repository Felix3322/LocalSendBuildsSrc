name: Sync upstream LocalSend

on:
  schedule:
    - cron: "17 04 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-localsend
  cancel-in-progress: false

jobs:
  sync:
    name: Merge latest upstream main
    runs-on: ubuntu-24.04

    steps:
      - name: Sync the upstream main branch when it advances
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response="$(gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main)"
          merge_type="$(jq -er '.merge_type' <<<"${response}")"

          if [[ "${merge_type}" == "none" ]]; then
            echo "Already synchronized with localsend/localsend main."
            exit 0
          fi

          echo "Synchronized localsend/localsend main using ${merge_type}."
          gh workflow run ci-release.yml --ref main
